    <!-- Theme & Language Init Script to prevent flash -->
    <script>
        // Theme Init
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }

        // Language Init: Priority -> LocalStorage > Browser Language > Default English
        const savedLang = localStorage.getItem('lang');
        const browserLang = navigator.language || navigator.userLanguage;
        // Check if browser language starts with 'ar' (e.g. ar-EG, ar-SA)
        const isArabicBrowser = browserLang && browserLang.startsWith('ar');
        
        const initialLang = savedLang ? savedLang : (isArabicBrowser ? 'ar' : 'en');
        
        document.documentElement.setAttribute('lang', initialLang);
        if (initialLang === 'ar') {
            document.documentElement.setAttribute('dir', 'rtl');
        } else {
            document.documentElement.setAttribute('dir', 'ltr');
        }
    </script>

    <script>
        // --- DATA CONTAINERS ---

        const commonData = {

        function setElementText(id, text) {
            const el = document.getElementById(id);
            if (el) el.innerText = text;
        }

        function setMetaContent(id, content) {
            const el = document.getElementById(id);
            if (el) el.setAttribute('content', content);
        }

        // --- LANGUAGE FUNCTION ---
        function toggleLanguage() {
            const currentLang = document.documentElement.getAttribute('lang') === 'en' ? 'ar' : 'en';
            setLanguage(currentLang);
        }

        function setLanguage(lang) {
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            localStorage.setItem('lang', lang);
            
            // Toggle Arabic Font Class on Body
            if (lang === 'ar') {
                document.body.classList.add('font-arabic');
            } else {
                document.body.classList.remove('font-arabic');
            }

            // Update Text Content safely
            const t = contactData[lang];
            setElementText('t-name', t.fullName);
            setElementText('t-title', t.title);
            setElementText('t-bio', t.bio);
            setElementText('t-save', t.save);
            setElementText('t-call', t.call);
            setElementText('t-email', t.email);
            setElementText('t-book', t.book);
            setElementText('t-schedule', t.schedule);
            setElementText('t-blog', t.blog);
            setElementText('t-articles', t.articles);
            setElementText('t-copyright', t.copyright);

            // Update Dynamic SEO Title and Meta Descriptions
            if (t.metaTitle) {
                document.title = t.metaTitle;
                setMetaContent('og-title', t.metaTitle);
                setMetaContent('tw-title', t.metaTitle);
            }
            if (t.metaDescription) {
                setMetaContent('meta-desc', t.metaDescription);
                setMetaContent('og-desc', t.metaDescription);
                setMetaContent('tw-desc', t.metaDescription);
            }

            // Update Language Switcher Button Text and Style
            const langBtn = document.getElementById('lang-btn-text');
            if (langBtn) {
                langBtn.innerText = t.langBtn;
                if (lang === 'en') {
                    // English page -> button indicates switch to Arabic ('ع')
                    langBtn.className = "w-10 h-10 rounded-full bg-deep-space-blue/30 hover:bg-deep-space-blue/50 text-parchment backdrop-blur-md flex items-center justify-center transition-all focus:outline-none active:scale-95 border border-white/20 font-arabic font-bold text-base leading-none";
                } else {
                    // Arabic page -> button indicates switch to English ('En')
                    langBtn.className = "w-10 h-10 rounded-full bg-deep-space-blue/30 hover:bg-deep-space-blue/50 text-parchment backdrop-blur-md flex items-center justify-center transition-all focus:outline-none active:scale-95 border border-white/20 font-sans font-bold text-xs leading-none";
                }
            }
        }

        // Initialize Language (Run on load)
        // We rely on the initial check done in the HEAD script.
        // We just need to apply the text content for whatever language was decided.
        const currentLangAttribute = document.documentElement.getAttribute('lang') || 'en';
        setLanguage(currentLangAttribute);


        // --- THEME TOGGLE FUNCTION ---
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        // --- SHARE FUNCTION ---
        async function shareProfile() {
            const lang = document.documentElement.getAttribute('lang') || 'en';
            const t = contactData[lang];

            const shareData = {
                title: document.title,
                text: t.shareTitle,
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('Share canceled or failed', err);
                }
            } else {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    const btn = document.querySelector('button[aria-label="Share"]');
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                    }, 2000);
                    alert(t.shareSuccess);
                } catch (err) {
                    console.error('Failed to copy: ', err);
                }
            }
        }

        // --- VCARD DOWNLOAD LOGIC ---
        function downloadVCard() {
            // Determine current language
            const lang = document.documentElement.getAttribute('lang') || 'en';
            const data = contactData[lang];

            // Construct vCard 3.0 string based on current language data
            const vcard = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `FN;CHARSET=UTF-8:${data.fullName}`,
                `N;CHARSET=UTF-8:${data.lastName};${data.firstName};${data.middleName};${data.prefix};`,
                `TITLE;CHARSET=UTF-8:${data.title}`,
                `ORG;CHARSET=UTF-8:${data.organization}`,
                `TEL;TYPE=CELL,VOICE:${commonData.mobile}`,
                `EMAIL;TYPE=WORK,INTERNET:${commonData.email}`,
                `URL;TYPE=WORK:${commonData.website}`,
                `URL;TYPE=X:${commonData.x}`,
                `URL;TYPE=WhatsApp:${commonData.whatsapp}`,
                `URL;TYPE=LinkedIn:${commonData.linkedin}`,
                `URL;TYPE=GitHub:${commonData.github}`,
                `X-SOCIALPROFILE;TYPE=twitter;x-user=fakhruldeen:${commonData.x}`,
                `X-SOCIALPROFILE;TYPE=whatsapp;x-user=m.fouad.fakhr:${commonData.whatsapp}`,
                `X-SOCIALPROFILE;TYPE=linkedin:${commonData.linkedin}`,
                `X-SOCIALPROFILE;TYPE=telegram;x-user=FOU4d:${commonData.telegram}`,
                `X-SOCIALPROFILE;TYPE=github;x-user=fakhruldeen:${commonData.github}`,
                `NOTE;CHARSET=UTF-8:${lang === 'ar' ? 'واتساب: @m.fouad.fakhr\\nتويتر / X: @fakhruldeen' : 'WhatsApp: @m.fouad.fakhr\\nX: @fakhruldeen'}`,
                "END:VCARD"
            ].join("\n");

            // Create a blob for the file
            const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            // Create a temporary link to trigger download
            const link = document.createElement("a");
            link.href = url;
            // File name changes dynamically based on language context
            link.setAttribute("download", data.vcardFileName);
            document.body.appendChild(link);
            
            // Trigger click
            link.click();
            
            // Cleanup
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
